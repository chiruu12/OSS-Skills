name: setup

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n setup

      - name: Targets are listed
        run: |
          targets=$(./setup --list)
          echo "$targets"
          for t in claude agents cursor cline copilot windsurf zed gemini kiro; do
            case " $targets " in
              *" $t "*) ;;
              *) echo "::error::--list is missing $t"; exit 1 ;;
            esac
          done

      - name: Every skill has the frontmatter setup reads
        run: |
          fail=0
          for d in skills/oss-*/; do
            f="$d/SKILL.md"
            [ -f "$f" ] || { echo "::error::$d has no SKILL.md"; fail=1; continue; }
            head -1 "$f" | grep -q '^---$' || { echo "::error::$f does not open with frontmatter"; fail=1; }
            grep -q '^name:' "$f" || { echo "::error::$f has no name:"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error::$f has no description:"; fail=1; }
          done
          exit $fail

      - name: Install every target
        run: |
          count=$(ls -d skills/oss-*/ | wc -l | tr -d ' ')
          echo "expecting $count skills"
          fail=0

          for t in agents cursor cline copilot windsurf zed gemini kiro; do
            d=$(mktemp -d)
            ./setup --target "$t" --dest "$d" >/dev/null || {
              echo "::error::$t failed to install"; fail=1; continue; }

            got=$(find "$d" \( -name 'oss-*.md' -o -name 'oss-*.mdc' \) | wc -l | tr -d ' ')
            if [ "$got" -ne "$count" ]; then
              echo "::error::$t installed $got skill files, expected $count"
              fail=1
            fi

            # Re-running must not duplicate or fail.
            ./setup --target "$t" --dest "$d" >/dev/null || {
              echo "::error::$t is not safe to re-run"; fail=1; continue; }
            again=$(find "$d" \( -name 'oss-*.md' -o -name 'oss-*.mdc' \) | wc -l | tr -d ' ')
            if [ "$again" -ne "$count" ]; then
              echo "::error::$t re-run changed file count to $again"
              fail=1
            fi

            echo "$t ok"
          done

          exit $fail

      - name: Router files point at skills that exist
        run: |
          d=$(mktemp -d)
          ./setup --target agents --dest "$d" >/dev/null
          fail=0
          for ref in $(grep -o '`\.oss-skills/[^`]*\.md`' "$d/AGENTS.md" | tr -d '`'); do
            [ -f "$d/$ref" ] || { echo "::error::AGENTS.md points at missing $ref"; fail=1; }
          done
          # Every installed skill must be routed to, not just exist on disk.
          for f in "$d"/.oss-skills/*.md; do
            name=$(basename "$f")
            grep -q "$name" "$d/AGENTS.md" || {
              echo "::error::$name is installed but absent from AGENTS.md"; fail=1; }
          done
          exit $fail

      - name: Embedded bodies have no leftover frontmatter
        run: |
          d=$(mktemp -d)
          ./setup --target agents --dest "$d" >/dev/null
          fail=0
          for f in "$d"/.oss-skills/*.md; do
            if head -1 "$f" | grep -q '^---$'; then
              echo "::error::$(basename "$f") still starts with frontmatter"
              fail=1
            fi
          done
          exit $fail

      - name: Claude target installs to the project
        run: |
          count=$(ls -d skills/oss-*/ | wc -l | tr -d ' ')
          d=$(mktemp -d)
          ./setup --target claude --local --dest "$d" >/dev/null
          got=$(find "$d/.claude/skills" -name SKILL.md | wc -l | tr -d ' ')
          [ "$got" -eq "$count" ] || {
            echo "::error::claude --local installed $got of $count"; exit 1; }

      - name: Unknown target fails loudly
        run: |
          if ./setup --target nonsense --dest "$(mktemp -d)" >/dev/null 2>&1; then
            echo "::error::an unknown target exited 0"
            exit 1
          fi
