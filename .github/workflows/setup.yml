name: setup

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: bash -n setup

      - name: Targets are listed
        run: |
          targets=$(./setup --list)
          echo "$targets"
          for t in claude agents cursor cline copilot windsurf zed gemini kiro; do
            case " $targets " in
              *" $t "*) ;;
              *) echo "::error::--list is missing $t"; exit 1 ;;
            esac
          done

      - name: Every skill has the frontmatter setup reads
        run: |
          fail=0
          for d in skills/oss-*/; do
            f="$d/SKILL.md"
            [ -f "$f" ] || { echo "::error::$d has no SKILL.md"; fail=1; continue; }
            head -1 "$f" | grep -q '^---$' || { echo "::error::$f does not open with frontmatter"; fail=1; }
            grep -q '^name:' "$f" || { echo "::error::$f has no name:"; fail=1; }
            grep -q '^description:' "$f" || { echo "::error::$f has no description:"; fail=1; }
          done
          exit $fail

      - name: Install every target
        run: |
          count=$(ls -d skills/oss-*/ | wc -l | tr -d ' ')
          echo "expecting $count skills"
          fail=0

          for t in agents cursor cline copilot windsurf zed gemini kiro; do
            d=$(mktemp -d)
            ./setup --target "$t" --dest "$d" >/dev/null || {
              echo "::error::$t failed to install"; fail=1; continue; }

            got=$(find "$d" \( -name 'oss-*.md' -o -name 'oss-*.mdc' \) | wc -l | tr -d ' ')
            if [ "$got" -ne "$count" ]; then
              echo "::error::$t installed $got skill files, expected $count"
              fail=1
            fi

            # Re-running must not duplicate or fail.
            ./setup --target "$t" --dest "$d" >/dev/null || {
              echo "::error::$t is not safe to re-run"; fail=1; continue; }
            again=$(find "$d" \( -name 'oss-*.md' -o -name 'oss-*.mdc' \) | wc -l | tr -d ' ')
            if [ "$again" -ne "$count" ]; then
              echo "::error::$t re-run changed file count to $again"
              fail=1
            fi

            echo "$t ok"
          done

          exit $fail

      - name: Router files point at skills that exist
        run: |
          d=$(mktemp -d)
          ./setup --target agents --dest "$d" >/dev/null
          fail=0
          for ref in $(grep -o '`\.oss-skills/[^`]*\.md`' "$d/AGENTS.md" | tr -d '`'); do
            [ -f "$d/$ref" ] || { echo "::error::AGENTS.md points at missing $ref"; fail=1; }
          done
          # Every installed skill must be routed to, not just exist on disk.
          for f in "$d"/.oss-skills/*.md; do
            name=$(basename "$f")
            grep -q "$name" "$d/AGENTS.md" || {
              echo "::error::$name is installed but absent from AGENTS.md"; fail=1; }
          done
          exit $fail

      - name: Embedded bodies have no leftover frontmatter
        run: |
          d=$(mktemp -d)
          ./setup --target agents --dest "$d" >/dev/null
          fail=0
          for f in "$d"/.oss-skills/*.md; do
            if head -1 "$f" | grep -q '^---$'; then
              echo "::error::$(basename "$f") still starts with frontmatter"
              fail=1
            fi
          done
          exit $fail

      - name: Existing project instructions survive installation
        run: |
          fail=0
          for pair in "agents:AGENTS.md" "gemini:GEMINI.md" "zed:.rules" "copilot:.github/copilot-instructions.md"; do
            t="${pair%%:*}"; f="${pair#*:}"
            d=$(mktemp -d)
            mkdir -p "$d/$(dirname "$f")"
            printf '# My Project\n\nNever touch vendor/.\n' > "$d/$f"

            ./setup --target "$t" --dest "$d" >/dev/null
            grep -q 'Never touch vendor/' "$d/$f" || {
              echo "::error::$t destroyed an existing $f"; fail=1; continue; }

            # Re-running must update the block in place, not stack copies.
            ./setup --target "$t" --dest "$d" >/dev/null
            ./setup --target "$t" --dest "$d" >/dev/null
            blocks=$(grep -c 'OSS-SKILLS:BEGIN' "$d/$f")
            [ "$blocks" -eq 1 ] || {
              echo "::error::$t left $blocks managed blocks in $f after 3 runs"; fail=1; }
            [ "$(grep -c 'My Project' "$d/$f")" -eq 1 ] || {
              echo "::error::$t duplicated user content in $f"; fail=1; }
          done
          exit $fail

      - name: Renamed rules do not linger, user rules are kept
        run: |
          fail=0
          d=$(mktemp -d)
          mkdir -p "$d/.cursor/rules"
          echo mine > "$d/.cursor/rules/my-own.mdc"
          echo mine > "$d/.cursor/rules/oss-my-own.mdc"
          ./setup --target cursor --dest "$d" >/dev/null

          # A skill installed by an earlier version, then renamed away.
          touch "$d/.cursor/rules/oss-removed.mdc"
          echo oss-removed.mdc >> "$d/.cursor/rules/.oss-skills-manifest"
          ./setup --target cursor --dest "$d" >/dev/null

          [ -f "$d/.cursor/rules/my-own.mdc" ] || {
            echo "::error::cursor deleted a rule the user wrote"; fail=1; }
          [ -f "$d/.cursor/rules/oss-my-own.mdc" ] || {
            echo "::error::cursor deleted a user rule just for being named oss-*"; fail=1; }
          [ -f "$d/.cursor/rules/oss-removed.mdc" ] && {
            echo "::error::cursor kept a stale managed rule"; fail=1; }

          exit $fail

      - name: Malformed marker blocks are never rewritten
        run: |
          fail=0
          # unmatched BEGIN / stray END / a good block followed by a stray BEGIN
          for case in "<!-- OSS-SKILLS:BEGIN - x -->" \
                      "<!-- OSS-SKILLS:END -->" \
                      "<!-- OSS-SKILLS:BEGIN - x -->|<!-- OSS-SKILLS:END -->|<!-- OSS-SKILLS:BEGIN - x -->"; do
            d=$(mktemp -d)
            echo header > "$d/AGENTS.md"
            echo "$case" | tr '|' '\n' >> "$d/AGENTS.md"
            echo 'tail instructions' >> "$d/AGENTS.md"

            if ./setup --target agents --dest "$d" >/dev/null 2>&1; then
              echo "::error::setup rewrote a file with markers: $case"
              fail=1
            fi
            grep -q 'tail instructions' "$d/AGENTS.md" || {
              echo "::error::setup destroyed instructions for case: $case"; fail=1; }
          done
          exit $fail

      - name: Managed cleanup keeps user workflows and stays in its directory
        run: |
          fail=0
          d=$(mktemp -d)
          ./setup --target agents --dest "$d" >/dev/null
          echo mine > "$d/.oss-skills/oss-my-own.md"
          echo secret > "$d/keep-me"
          printf '../keep-me\noss-removed.md\n' >> "$d/.oss-skills/.oss-skills-manifest"
          touch "$d/.oss-skills/oss-removed.md"
          ./setup --target agents --dest "$d" >/dev/null

          [ -f "$d/keep-me" ] || {
            echo "::error::manifest cleanup escaped the rules directory"; fail=1; }
          [ -f "$d/.oss-skills/oss-my-own.md" ] || {
            echo "::error::cleanup deleted a workflow the user wrote"; fail=1; }
          [ -f "$d/.oss-skills/oss-removed.md" ] && {
            echo "::error::cleanup kept a stale managed workflow"; fail=1; }
          exit $fail

      - name: Symlinks are refused, never written through
        run: |
          fail=0

          check() {
            # $1 names the case, $2 is the file that must come back untouched.
            if ./setup --target "$3" --dest "$4" >/dev/null 2>&1; then
              echo "::error::setup followed a symlink: $1"; fail=1
            fi
            [ "$(cat "$2")" = "do not touch" ] || {
              echo "::error::setup wrote through a symlink: $1"; fail=1; }
          }

          # the manifest itself
          d=$(mktemp -d); mkdir -p "$d/proj/.oss-skills" "$d/out"
          echo "do not touch" > "$d/out/victim"
          ln -s "$d/out/victim" "$d/proj/.oss-skills/.oss-skills-manifest"
          check "manifest" "$d/out/victim" agents "$d/proj"

          # the router file
          d=$(mktemp -d); mkdir -p "$d/proj" "$d/out"
          echo "do not touch" > "$d/out/victim"
          ln -s "$d/out/victim" "$d/proj/AGENTS.md"
          check "router file" "$d/out/victim" agents "$d/proj"

          # a file inside the managed directory
          d=$(mktemp -d); mkdir -p "$d/proj/.cursor/rules" "$d/out"
          echo "do not touch" > "$d/out/victim"
          ln -s "$d/out/victim" "$d/proj/.cursor/rules/oss-contribute.mdc"
          check "managed file" "$d/out/victim" cursor "$d/proj"

          # the managed directory
          d=$(mktemp -d); mkdir -p "$d/proj" "$d/out"
          echo "do not touch" > "$d/out/victim"
          ln -s "$d/out" "$d/proj/.oss-skills"
          check "managed directory" "$d/out/victim" agents "$d/proj"
          [ "$(ls -A "$d/out" | tr -d '[:space:]')" = "victim" ] || {
            echo "::error::setup wrote into a symlinked managed directory"; fail=1; }

          # a symlinked parent of the managed directory
          d=$(mktemp -d); mkdir -p "$d/proj" "$d/out"
          echo "do not touch" > "$d/out/victim"
          ln -s "$d/out" "$d/proj/.cursor"
          check "symlinked parent" "$d/out/victim" cursor "$d/proj"
          [ "$(ls -A "$d/out" | tr -d '[:space:]')" = "victim" ] || {
            echo "::error::setup created directories through a symlinked parent"; fail=1; }

          exit $fail

      - name: A destination you named yourself may be a symlink
        run: |
          fail=0
          d=$(mktemp -d)
          mkdir -p "$d/project"
          ln -s "$d/project" "$d/link"
          for t in agents cursor copilot; do
            ./setup --target "$t" --dest "$d/link" >/dev/null || {
              echo "::error::$t refused a symlinked destination"; fail=1; }
          done
          ./setup --target claude --local --dest "$d/link" >/dev/null || {
            echo "::error::claude --local refused a symlinked destination"; fail=1; }
          [ -f "$d/project/AGENTS.md" ] || {
            echo "::error::install did not land in the symlink's target"; fail=1; }
          exit $fail

      - name: Claude target installs to the project
        run: |
          count=$(ls -d skills/oss-*/ | wc -l | tr -d ' ')
          d=$(mktemp -d)
          ./setup --target claude --local --dest "$d" >/dev/null
          got=$(find "$d/.claude/skills" -name SKILL.md | wc -l | tr -d ' ')
          [ "$got" -eq "$count" ] || {
            echo "::error::claude --local installed $got of $count"; exit 1; }

      - name: Unknown target fails loudly
        run: |
          if ./setup --target nonsense --dest "$(mktemp -d)" >/dev/null 2>&1; then
            echo "::error::an unknown target exited 0"
            exit 1
          fi
